name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned IPA
        run: |
          xcodebuild archive \
            -project StockTracker.xcodeproj \
            -scheme StockTracker \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/StockTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          mkdir -p build/Payload
          cp -r build/StockTracker.xcarchive/Products/Applications/StockTracker.app build/Payload/
          cd build
          zip -r StockTracker.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockTracker-IPA
          path: build/StockTracker.ipa
          retention-days: 30
